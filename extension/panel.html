<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bewpakorn Queue</title><link rel="stylesheet" href="style.css"></head><body><main>
<header><div><p class="eyebrow">BEWPAKORN</p><h1>คิวออเดอร์</h1><p class="sub">มาก่อนได้ก่อน</p></div><span id="connection" class="pill">กำลังเชื่อมต่อ</span></header>
<section class="card" aria-labelledby="order-title"><div class="row"><h2 id="order-title">ออเดอร์ปัจจุบัน</h2><span id="order-id" class="muted"></span></div><div id="order-details" class="details">กำลังตรวจสอบสถานะ</div></section>
<section class="roles" aria-label="สถานะบัญชี"><article class="card role"><h2>บัญชีลูกค้า</h2><p id="customer-name">—</p><span id="customer-state" class="status">รอออเดอร์</span></article><article class="card role"><h2>บัญชีของคุณ</h2><p id="operator-name">—</p><span id="operator-state" class="status">รอออเดอร์</span></article></section>
<div id="issue" class="notice" role="status" aria-live="polite" hidden></div><button id="complete" type="button" disabled>สำเร็จ</button><p class="hint">จัดการงานนี้แล้ว ไปคิวถัดไป</p>
<section class="queue"><div class="row"><h2>คิวถัดไป</h2><span id="queue-count" class="muted"></span></div><ol id="queue-list"></ol></section><footer><a href="options.html" target="_blank">ตั้งค่าและจับคู่บัญชี</a></footer>
</main><script type="module" src="panel.js"></script></body></html>
